<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Workflow Editor</title>
<style>
  :root {
    --brand: #FF7A1A;
    --brand-dark: #E86A0F;
    --brand-soft: #FFE9D6;
    --blue: #4B8FE8;
    --blue-soft: #E8F1FC;
    --teal: #3DB8A8;
    --teal-soft: #E4F7F4;
    --purple: #9B7AE8;
    --purple-soft: #F0EBFC;
    --orange: #F0A03A;
    --orange-soft: #FFF3E4;
    --cat-blue-icon: #3E6FC4;
    --cat-teal-icon: #1E9C82;
    --cat-purple-icon: #C24E90;
    --cat-orange-icon: #C97F1F;
    --text: #1A1A1A;
    --muted: #7A7A7A;
    --line: #C8C8C8;
    --border: #ECECEC;
    --bg: #F4F5F7;
    --panel: rgba(255,255,255,0.82);
    --shadow: 0 10px 30px rgba(20,24,40,0.08);
    --shadow-lift: 0 16px 40px rgba(20,24,40,0.14);
    --radius: 16px;
    --ease: cubic-bezier(0.22, 1, 0.36, 1);
    --spring: cubic-bezier(0.34, 1.4, 0.64, 1);
    --font: "Pretendard", -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", sans-serif;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: var(--font);
    color: var(--text);
    background: var(--bg);
    display: flex;
    height: 100vh;
    overflow: hidden;
    font-size: 13.5px;
    -webkit-font-smoothing: antialiased;
  }
  button { font-family: inherit; }

  /* ---------- Rail (collapses to icons / expands like Orange nav) ---------- */
  .rail {
    width: 220px;
    background: #fff;
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    padding: 12px 10px;
    gap: 2px;
    flex-shrink: 0;
    z-index: 5;
    transition: width .28s var(--ease);
    overflow: hidden;
  }
  .rail.collapsed {
    width: 64px;
    align-items: center;
    padding: 12px 8px;
  }
  .rail-head {
    display: flex; align-items: center; gap: 8px;
    padding: 4px 6px 14px;
    min-height: 56px;
  }
  .rail-logo {
    display: flex; flex-direction: column; justify-content: center;
    line-height: 1; min-width: 0; flex: 1;
    user-select: none;
    font-family: "Pretendard", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  .rail-logo-word {
    display: inline;
    font-size: 28px; font-weight: 700; letter-spacing: -0.04em;
    color: #2A2A2A;
  }
  .rail-logo-word .ver {
    font-size: 32px;
    font-weight: 700;
  }
  .rail-logo-sub {
    margin-top: 5px;
    font-size: 9px; font-weight: 700; letter-spacing: 0.12em;
    color: var(--brand);
    text-transform: uppercase;
  }
  .rail.collapsed .rail-head {
    justify-content: center;
    padding: 4px 0 10px;
    min-height: 36px;
  }
  .rail.collapsed .rail-logo,
  .rail .logo-mark {
    display: none !important;
  }
  .rail-toggle {
    margin-left: auto; flex-shrink: 0;
    width: 28px; height: 28px; border: none; background: transparent;
    border-radius: 8px; color: var(--muted); cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .rail.collapsed .rail-toggle { margin-left: 0; }
  .rail-toggle:hover { background: #F3F3F3; color: var(--text); }
  .rail-toggle svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.8; }

  .rail-section {
    display: flex; flex-direction: column; gap: 2px;
    padding: 6px 0;
    border-top: 1px solid var(--border);
  }
  .rail-section:first-of-type { border-top: none; padding-top: 0; }
  .rail .spacer { flex: 1; min-height: 8px; }

  .rail-item {
    border: none; background: transparent;
    border-radius: 10px; color: #4A4A4A; cursor: pointer;
    display: flex; align-items: center; gap: 12px;
    width: 100%;
    padding: 9px 10px;
    font-family: inherit; font-size: 13.5px; font-weight: 550;
    text-align: left;
    white-space: nowrap;
    transition: background .18s var(--ease), color .18s;
  }
  .rail.collapsed .rail-item {
    width: 40px; height: 40px; padding: 0;
    justify-content: center; gap: 0;
  }
  .rail-item .ri-ico {
    width: 20px; height: 20px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
  }
  .rail-item .ri-ico svg {
    width: 18px; height: 18px; stroke: currentColor; fill: none;
    stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round;
  }
  .rail-item .ri-label {
    overflow: hidden; text-overflow: ellipsis;
    opacity: 1; transition: opacity .18s;
  }
  .rail.collapsed .rail-item .ri-label { display: none; }
  .rail-item:hover { background: #F5F5F5; color: var(--text); }
  .rail-item.active {
    background: var(--brand-soft);
    color: var(--brand-dark);
    font-weight: 650;
  }

  /* ---------- Rail 4-depth menu tree ---------- */
  .rail-scroll {
    flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden;
    scrollbar-width: thin;
    display: flex; flex-direction: column; gap: 2px;
  }
  .rail.collapsed .rail-scroll { overflow: visible; }
  #railBottom {
    margin-top: auto; flex-shrink: 0;
    border-top: 1px solid var(--border);
    padding-top: 6px;
  }

  .rail-group { display: flex; flex-direction: column; gap: 1px; }

  /* Unified chevron (right ▶ · open/down ▼ · left ◀) */
  .ico-chevron {
    display: inline-flex; align-items: center; justify-content: center;
    flex-shrink: 0; opacity: .45;
    transition: transform .22s var(--ease), opacity .18s;
  }
  .ico-chevron svg {
    width: 14px; height: 14px;
    stroke: currentColor; fill: none;
    stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round;
  }
  .ico-chevron--left { transform: rotate(180deg); }
  .ico-chevron--down { transform: rotate(90deg); }

  .rail-item.has-children .ico-chevron,
  .rail-sub.has-children .ico-chevron { margin-left: auto; }
  .rail.collapsed .rail-item .ico-chevron { display: none; }
  .rail-group.open > .rail-item.has-children .ico-chevron,
  .rail-sub-wrap.open > .rail-sub.has-children .ico-chevron {
    transform: rotate(90deg);
  }

  .rail-children {
    display: grid; grid-template-rows: 0fr;
    transition: grid-template-rows .24s var(--ease);
  }
  .rail-group.open > .rail-children { grid-template-rows: 1fr; }
  .rail-children > .rail-children-inner {
    overflow: hidden;
    display: flex; flex-direction: column; gap: 1px;
    padding-left: 10px;
    margin-left: 19px;
    border-left: 1px solid rgba(0,0,0,.06);
  }
  .rail.collapsed .rail-children { display: none; }

  .rail-sub-wrap { display: flex; flex-direction: column; gap: 1px; }

  .rail-sub {
    border: none; background: transparent;
    border-radius: 8px; color: #5A5A5A; cursor: pointer;
    display: flex; align-items: center; gap: 8px;
    width: 100%; padding: 7px 8px;
    font-family: inherit; font-size: 12.5px; font-weight: 550;
    text-align: left; white-space: nowrap;
    transition: background .18s var(--ease), color .18s;
  }
  .rail-sub:hover { background: #F5F5F5; color: var(--text); }
  .rail-sub.active { background: var(--brand-soft); color: var(--brand-dark); font-weight: 650; }

  .rail-sub-children {
    display: grid; grid-template-rows: 0fr;
    transition: grid-template-rows .24s var(--ease);
  }
  .rail-sub-wrap.open > .rail-sub-children { grid-template-rows: 1fr; }
  .rail-sub-children > .rail-sub-children-inner {
    overflow: hidden;
    display: flex; flex-direction: column; gap: 1px;
    padding-left: 8px;
    margin: 0 0 2px 12px;
    border-left: 1px dashed rgba(0,0,0,.08);
  }

  .rail-leaf {
    border: none; background: transparent;
    border-radius: 7px; color: #666; cursor: pointer;
    display: flex; align-items: center; gap: 7px;
    width: 100%; padding: 6px 8px;
    font-family: inherit; font-size: 12px; font-weight: 500;
    text-align: left; white-space: nowrap;
    transition: background .18s var(--ease), color .18s;
  }
  .rail-leaf::before {
    content: ''; width: 4px; height: 4px; border-radius: 50%;
    background: currentColor; opacity: .35; flex-shrink: 0;
  }
  .rail-leaf:hover { background: #F5F5F5; color: var(--text); }
  .rail-leaf.active {
    background: var(--brand-soft); color: var(--brand-dark); font-weight: 650;
  }
  .rail-leaf.active::before { opacity: .8; background: var(--brand); }

  .rail-leaf[data-depth="4"] {
    font-size: 11.5px; padding: 5px 8px 5px 10px; color: #777;
  }
  .rail-leaf[data-depth="4"]::before { width: 3px; height: 3px; }

  /* Flyout when rail collapsed */
  .rail-flyout {
    position: fixed; z-index: 200;
    min-width: 200px; max-width: 260px;
    background: rgba(255,255,255,.96);
    backdrop-filter: blur(16px);
    border: 1px solid var(--border);
    border-radius: 14px;
    box-shadow: var(--shadow-lift);
    padding: 8px;
    opacity: 0; pointer-events: none;
    transform: translateX(-6px);
    transition: opacity .18s var(--ease), transform .22s var(--ease);
  }
  .rail-flyout.show {
    opacity: 1; pointer-events: auto; transform: translateX(0);
  }
  .rail-flyout-title {
    padding: 6px 10px 8px; font-size: 11px; font-weight: 700;
    letter-spacing: .04em; text-transform: uppercase; color: var(--muted);
  }
  .rail-flyout .rail-sub,
  .rail-flyout .rail-leaf { font-size: 13px; padding: 8px 10px; }
  .rail-flyout .rail-sub-children > .rail-sub-children-inner {
    margin-left: 8px; padding-left: 6px;
  }
  .rail-flyout .rail-children > .rail-children-inner {
    margin-left: 0; padding-left: 6px; border-left: none;
  }
  .rail-flyout .rail-children,
  .rail-flyout .rail-sub-children { grid-template-rows: 1fr !important; }
  .rail-flyout .rail-children > .rail-children-inner,
  .rail-flyout .rail-sub-children > .rail-sub-children-inner { overflow: visible; }

  /* ---------- Sidebar ---------- */
  .sidebar {
    width: 300px;
    background: var(--panel);
    backdrop-filter: blur(20px);
    border-right: 1px solid var(--border);
    display: flex; flex-direction: column;
    flex-shrink: 0;
    transition: width .28s var(--ease), opacity .22s var(--ease), transform .28s var(--ease);
    overflow: hidden;
    z-index: 4;
  }
  .sidebar.collapsed { width: 0; opacity: 0; pointer-events: none; }
  .sidebar-inner { width: 300px; display: flex; flex-direction: column; height: 100%; }
  .sidebar-header {
    padding: 16px 14px 8px 18px;
    font-weight: 700; font-size: 16px;
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
  }
  .sidebar-header .sidebar-title {
    display: flex; align-items: baseline; gap: 8px; min-width: 0;
  }
  .sidebar-header .hint { font-size: 11px; font-weight: 500; color: var(--muted); }
  .sidebar-collapse {
    width: 28px; height: 28px; flex-shrink: 0;
    border: none; border-radius: 8px; background: transparent;
    color: var(--muted); cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background .18s var(--ease), color .18s;
  }
  .sidebar-collapse:hover { background: rgba(0,0,0,.05); color: var(--text); }
  .sidebar-collapse .ico-chevron { opacity: 1; }
  .sidebar-collapse .ico-chevron svg { width: 16px; height: 16px; }

  .sidebar-expand-tab {
    position: absolute; left: 0; top: 50%; z-index: 6;
    transform: translate(-50%, -50%);
    width: 22px; height: 52px;
    border: 1px solid var(--border); border-left: none;
    border-radius: 0 10px 10px 0;
    background: rgba(255,255,255,.92);
    backdrop-filter: blur(12px);
    box-shadow: var(--shadow);
    color: var(--muted); cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: color .18s, background .18s, box-shadow .18s;
  }
  .sidebar-expand-tab:hover {
    color: var(--brand-dark); background: #fff;
    box-shadow: var(--shadow-lift);
  }
  .sidebar-expand-tab[hidden] { display: none; }
  .sidebar-expand-tab .ico-chevron { opacity: 1; }
  .sidebar-expand-tab .ico-chevron svg { width: 14px; height: 14px; }
  .search { margin: 0 16px 12px; position: relative; }
  .search input {
    width: 100%; padding: 10px 34px 10px 12px;
    border-radius: 12px; border: 1px solid var(--border);
    background: rgba(255,255,255,0.7); font-size: 13px; font-family: inherit;
    transition: border-color .2s, box-shadow .2s;
  }
  .search input:focus {
    outline: none; border-color: rgba(255,122,26,0.45);
    box-shadow: 0 0 0 3px rgba(255,122,26,0.12);
  }
  .search .clear {
    position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
    border: none; background: none; color: var(--muted); cursor: pointer; font-size: 14px;
  }
  .categories { overflow-y: auto; padding-bottom: 24px; scrollbar-width: thin; }

  .cat {
    margin: 0 12px 10px;
    border-radius: 14px;
    overflow: hidden;
    background: rgba(255,255,255,0.55);
    border: 1px solid rgba(0,0,0,0.04);
  }
  .cat-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 12px; cursor: pointer; user-select: none;
    font-weight: 650; font-size: 13px;
    transition: filter .2s;
  }
  .cat-header:hover { filter: brightness(0.98); }
  .cat-header .left { display: flex; align-items: center; gap: 8px; }
  .cat-dot { width: 8px; height: 8px; border-radius: 50%; }
  .cat-count { opacity: .65; font-weight: 500; margin-left: 4px; }
  .cat:not(.collapsed) .ico-chevron { transform: rotate(90deg); }
  .cat.collapsed .cat-items { display: none; }
  .cat-items {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    padding: 4px 10px 14px;
  }
  .widget {
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    padding: 6px 4px; border-radius: 12px; cursor: grab;
    border: 1px solid transparent;
    transition: transform .22s var(--spring), background .2s, box-shadow .22s, border-color .2s;
  }
  .widget:hover {
    background: #fff;
    border-color: rgba(0,0,0,0.05);
    transform: translateY(-2px) scale(1.04);
    box-shadow: var(--shadow);
  }
  .widget:active { cursor: grabbing; transform: scale(0.97); }
  .widget .label {
    font-size: 10.5px; color: var(--muted); text-align: center;
    line-height: 1.25; max-width: 72px;
  }

  /* ---------- Glass squircle icon tiles ---------- */
  .icon-tile {
    width: 52px; height: 52px; border-radius: 17px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; position: relative;
    isolation: isolate;
    overflow: hidden;
    background:
      linear-gradient(155deg, rgba(255,255,255,.72) 0%, rgba(255,255,255,.28) 42%, transparent 70%),
      linear-gradient(160deg,
        color-mix(in srgb, var(--tile-a, #fff) 55%, transparent) 0%,
        color-mix(in srgb, var(--tile-b, #f2f2f2) 42%, transparent) 100%);
    backdrop-filter: blur(14px) saturate(1.35);
    -webkit-backdrop-filter: blur(14px) saturate(1.35);
    border: 1px solid color-mix(in srgb, var(--tile-border-color, #fff) 55%, rgba(255,255,255,.65));
    box-shadow:
      0 1px 0 rgba(255,255,255,.85) inset,
      0 -1px 0 rgba(255,255,255,.15) inset,
      0 8px 20px -6px var(--tile-shadow, rgba(0,0,0,.12)),
      0 2px 6px rgba(20,24,40,.04);
    color: var(--tile-icon, #6B6B6B);
    transition: transform .22s var(--spring), box-shadow .22s var(--ease), border-color .2s, background .2s;
  }
  .icon-tile::before {
    content: '';
    position: absolute; inset: 1px;
    border-radius: inherit;
    background: linear-gradient(180deg, rgba(255,255,255,.55) 0%, rgba(255,255,255,.08) 38%, transparent 58%);
    pointer-events: none;
    z-index: 0;
  }
  .icon-tile::after {
    content: '';
    position: absolute; left: 18%; right: 18%; top: 7%; height: 28%;
    border-radius: 999px;
    background: linear-gradient(180deg, rgba(255,255,255,.7), rgba(255,255,255,0));
    filter: blur(1px);
    pointer-events: none;
    z-index: 0;
  }
  .icon-tile svg {
    width: 26px; height: 26px; display: block;
    position: relative; z-index: 1;
    filter: drop-shadow(0 1px 0 rgba(255,255,255,.35));
  }
  .icon-tile.lg { width: 64px; height: 64px; border-radius: 20px; }
  .icon-tile.lg svg { width: 30px; height: 30px; }
  .icon-tile.xl { width: 72px; height: 72px; border-radius: 22px; }
  .icon-tile.xl svg { width: 34px; height: 34px; }
  .icon-tile.node { width: 64px; height: 64px; border-radius: 20px; }
  .icon-tile.node svg { width: 30px; height: 30px; }

  .icon-blue {
    --tile-a: #E8F1FC; --tile-b: #C9DBF5;
    --tile-border-color: rgba(62,111,196,.35); --tile-shadow: rgba(62,111,196,.22);
    --tile-icon: var(--cat-blue-icon);
  }
  .icon-teal {
    --tile-a: #E4F7F4; --tile-b: #B8EBDD;
    --tile-border-color: rgba(30,156,130,.35); --tile-shadow: rgba(30,156,130,.22);
    --tile-icon: var(--cat-teal-icon);
  }
  .icon-purple {
    --tile-a: #F8EEF6; --tile-b: #EED0E4;
    --tile-border-color: rgba(194,78,144,.35); --tile-shadow: rgba(194,78,144,.22);
    --tile-icon: var(--cat-purple-icon);
  }
  .icon-orange {
    --tile-a: #FFF4E6; --tile-b: #F5D9B0;
    --tile-border-color: rgba(201,127,31,.35); --tile-shadow: rgba(201,127,31,.22);
    --tile-icon: var(--cat-orange-icon);
  }

  /* ---------- Main ---------- */
  .main { flex: 1; display: flex; flex-direction: column; min-width: 0; position: relative; }

  .tabs {
    min-height: 48px; display: flex; align-items: flex-end;
    padding: 10px 12px 0;
    background: #EEF0F3;
    gap: 0;
    border-bottom: none;
    position: relative;
    z-index: 2;
  }
  .tabs-list {
    display: flex; align-items: flex-end;
    gap: 0; min-width: 0; overflow-x: auto;
    scrollbar-width: none;
    padding: 0 20px;
  }
  .tabs-list::-webkit-scrollbar { display: none; }

  .tab {
    --tab-bg: #3E7BDB;
    position: relative;
    display: inline-flex; align-items: center; justify-content: center;
    gap: 8px;
    height: 36px; padding: 0 20px;
    margin: 0 2px;
    border: none;
    cursor: pointer;
    background: transparent;
    color: #fff;
    font-family: inherit; font-size: 13px; font-weight: 700;
    letter-spacing: -0.01em;
    white-space: nowrap;
    border-radius: 14px 14px 0 0;
    z-index: 1;
  }
  .tab:hover { z-index: 3; }
  .tab:hover .tab-shade {
    box-shadow: 0 -3px 8px rgba(20,24,40,.12), inset 0 0 0 999px rgba(255,255,255,.1);
  }
  .tab.active { z-index: 5; }

  /* solid fill + folder ears */
  .tab-shade {
    position: absolute;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    background: var(--tab-bg);
    border-radius: 14px 14px 0 0;
    box-shadow: 0 -3px 8px rgba(20,24,40,.12);
  }
  .tab-shade::before,
  .tab-shade::after {
    content: '';
    position: absolute;
    bottom: 0;
    width: 12px;
    height: 12px;
  }
  .tab-shade::before {
    left: -12px;
    background: radial-gradient(circle at 0 0, transparent 11.5px, var(--tab-bg) 12px);
  }
  .tab-shade::after {
    right: -12px;
    background: radial-gradient(circle at 100% 0, transparent 11.5px, var(--tab-bg) 12px);
  }

  .tab.tab-blue { --tab-bg: #3E7BDB; }
  .tab.tab-teal { --tab-bg: #3EB8AE; }
  .tab.tab-orange { --tab-bg: #F28A2E; }
  .tab.tab-green { --tab-bg: #5BB85A; }
  .tab.tab-purple { --tab-bg: #9B7AE8; }

  .tab-label { position: relative; z-index: 1; pointer-events: none; }
  .tab-close {
    position: relative; z-index: 1;
    width: 18px; height: 18px; flex-shrink: 0;
    border: none; border-radius: 50%;
    background: transparent; color: #fff;
    display: inline-flex; align-items: center; justify-content: center;
    cursor: pointer; padding: 0;
    opacity: .7;
    transition: opacity .15s, background .15s;
  }
  .tab-close:hover {
    opacity: 1;
    background: rgba(0,0,0,.18);
  }
  .tab-close svg {
    width: 10px; height: 10px;
    stroke: currentColor; fill: none;
    stroke-width: 2.2; stroke-linecap: round;
  }

  .tab-add {
    position: relative; z-index: 2;
    margin: 0 0 4px 14px;
    width: 28px; height: 28px; border-radius: 8px;
    border: none; background: rgba(255,255,255,.75); color: var(--muted); cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center;
    transition: background .2s, color .2s;
    flex-shrink: 0;
    box-shadow: 0 1px 4px rgba(20,24,40,.08);
  }
  .tab-add:hover { background: #fff; color: var(--text); }
  .tabs-actions {
    margin-left: auto; display: flex; align-items: center; gap: 6px;
    padding-bottom: 8px; flex-shrink: 0;
  }
  .btn-run {
    background: linear-gradient(145deg, #FF9440, var(--brand));
    color: #fff; border: none; font-weight: 700;
    padding: 7px 14px; border-radius: 8px; cursor: pointer;
    box-shadow: 0 4px 12px rgba(255,122,26,0.25);
    transition: transform .2s var(--spring), box-shadow .2s, filter .2s;
  }
  .btn-run:hover { transform: translateY(-1px); filter: brightness(1.03); }
  .btn-run:active { transform: scale(0.97); }
  .btn-ghost {
    background: transparent; border: 1px solid var(--border); font-weight: 600;
    color: var(--text); padding: 6px 12px; border-radius: 8px; cursor: pointer;
    transition: background .2s;
  }
  .btn-ghost:hover { background: #F5F5F5; }

  /* ---------- Splash / Loading ---------- */
  .splash {
    position: fixed; inset: 0; z-index: 200;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
    background:
      radial-gradient(ellipse 80% 60% at 20% 15%, rgba(255,255,255,.22), transparent 55%),
      radial-gradient(ellipse 70% 50% at 85% 80%, rgba(180,40,0,.25), transparent 50%),
      linear-gradient(155deg, #FF9A3D 0%, #FF7A1A 42%, #E85A0A 100%);
    transition: opacity .55s var(--ease), visibility .55s;
  }
  .splash.is-done {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
  }
  .splash-bubbles {
    position: absolute; inset: 0;
    pointer-events: none;
  }
  .splash-bubble {
    position: absolute;
    display: block;
    border-radius: 28px;
    background: rgba(255,255,255,.92);
    box-shadow:
      0 14px 32px rgba(120,40,0,.22),
      0 2px 0 rgba(255,255,255,.6) inset;
    overflow: hidden;
    animation: splashFloat 5.5s ease-in-out infinite;
  }
  .splash-bubble img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: contain;
    padding: 10%;
    box-sizing: border-box;
  }
  .splash-bubble.b1 { width: 118px; height: 118px; left: 7%; top: 14%; animation-delay: 0s; }
  .splash-bubble.b2 { width: 132px; height: 132px; left: 16%; top: 52%; animation-delay: -.9s; }
  .splash-bubble.b3 { width: 108px; height: 108px; left: 5%; bottom: 10%; animation-delay: -1.7s; }
  .splash-bubble.b4 { width: 96px; height: 96px; left: 28%; top: 10%; animation-delay: -2.3s; }
  .splash-bubble.b5 { width: 140px; height: 140px; right: 8%; top: 38%; animation-delay: -1.2s; }
  .splash-bubble.b6 { width: 124px; height: 124px; right: 6%; bottom: 12%; animation-delay: -2.1s; }
  .splash-bubble.b7 { width: 88px; height: 88px; right: 22%; top: 12%; animation-delay: -.4s; }
  .splash-bubble.b8 { width: 100px; height: 100px; right: 28%; bottom: 22%; animation-delay: -2.8s; }
  @keyframes splashFloat {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    50% { transform: translateY(-16px) rotate(2deg); }
  }

  .splash-center {
    position: relative; z-index: 1;
    display: flex; flex-direction: column; align-items: center;
    text-align: center;
    padding: 24px;
    animation: splashIn .7s var(--ease) both;
  }
  @keyframes splashIn {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .splash-eyebrow {
    margin: 0 0 14px;
    font-size: clamp(14px, 2.2vw, 18px);
    font-weight: 600;
    color: rgba(255,255,255,.88);
    letter-spacing: -0.01em;
  }
  .splash-title {
    margin: 0 0 36px;
    font-size: clamp(36px, 6.5vw, 64px);
    font-weight: 800;
    line-height: 1.15;
    letter-spacing: -0.04em;
    color: #fff;
    text-shadow: 0 8px 28px rgba(120,40,0,.2);
  }
  .splash-loader {
    width: min(280px, 70vw);
    display: flex; flex-direction: column; align-items: center; gap: 10px;
  }
  .splash-track {
    width: 100%; height: 8px;
    border-radius: 999px;
    background: rgba(255,255,255,.28);
    overflow: hidden;
  }
  .splash-bar {
    height: 100%; width: 0%;
    border-radius: inherit;
    background: #fff;
    box-shadow: 0 0 16px rgba(255,255,255,.45);
    transition: width .12s linear;
  }
  .splash-pct {
    font-size: 13px; font-weight: 650;
    color: rgba(255,255,255,.9);
    letter-spacing: 0.02em;
  }
  .splash-mark {
    position: absolute; right: 22px; bottom: 20px;
    width: 52px; height: 52px; border-radius: 50%;
    background: #fff;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 8px 20px rgba(120,40,0,.2);
    font-size: 11px; font-weight: 800;
    letter-spacing: -0.02em; color: #2A2A2A;
  }
  .splash-mark span { color: var(--brand); }

  /* ---------- Auth ---------- */
  .auth-overlay {
    position: fixed; inset: 0; z-index: 100;
    display: flex; align-items: center; justify-content: center;
    background: rgba(20, 24, 40, 0.45);
    backdrop-filter: blur(10px);
    padding: 24px;
  }
  .auth-overlay[hidden] { display: none !important; }
  .auth-card {
    width: min(400px, 100%);
    background: #fff;
    border-radius: 20px;
    padding: 32px 28px 28px;
    box-shadow: 0 24px 60px rgba(20,24,40,0.22);
  }
  .auth-brand { text-align: center; margin-bottom: 22px; }
  .auth-brand .word {
    font-size: 30px; font-weight: 700; letter-spacing: -0.04em; color: #2A2A2A;
  }
  .auth-brand .word .ver { font-size: 34px; }
  .auth-brand .sub {
    margin-top: 6px;
    font-size: 10px; font-weight: 700; letter-spacing: 0.12em;
    color: var(--brand); text-transform: uppercase;
  }
  .auth-title {
    font-size: 18px; font-weight: 700; text-align: center; margin: 0 0 6px;
  }
  .auth-desc {
    text-align: center; color: var(--muted); font-size: 13px; margin: 0 0 20px;
  }
  .auth-field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
  .auth-field label { font-size: 12px; font-weight: 650; color: #555; }
  .auth-field input {
    height: 42px; padding: 0 12px; border-radius: 10px;
    border: 1px solid var(--border); background: #FAFAFA;
    font: inherit; color: var(--text); outline: none;
    transition: border-color .15s, background .15s, box-shadow .15s;
  }
  .auth-field input:focus {
    border-color: var(--brand);
    background: #fff;
    box-shadow: 0 0 0 3px rgba(255,122,26,0.15);
  }
  .auth-error {
    min-height: 18px; margin: 0 0 10px;
    color: #D14343; font-size: 12.5px; font-weight: 600;
  }
  .auth-submit {
    width: 100%; height: 44px; border: none; border-radius: 10px;
    background: linear-gradient(145deg, #FF9440, var(--brand));
    color: #fff; font: inherit; font-weight: 700; cursor: pointer;
    box-shadow: 0 6px 16px rgba(255,122,26,0.28);
    transition: transform .15s, filter .15s;
  }
  .auth-submit:hover { filter: brightness(1.03); transform: translateY(-1px); }
  .auth-submit:active { transform: scale(0.98); }
  .auth-hint {
    margin: 14px 0 0; text-align: center;
    font-size: 12px; color: var(--muted);
  }

  #railAuth { border-top: 1px solid var(--border); padding-top: 6px; }
  .auth-user {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 10px 10px; min-width: 0;
  }
  .rail.collapsed .auth-user { justify-content: center; padding: 6px 0 8px; }
  .auth-avatar {
    width: 32px; height: 32px; border-radius: 50%; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    background: var(--brand-soft); color: var(--brand-dark);
    font-size: 13px; font-weight: 750;
  }
  .auth-meta { min-width: 0; flex: 1; }
  .rail.collapsed .auth-meta { display: none; }
  .auth-name {
    font-size: 13px; font-weight: 700; color: var(--text);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .auth-email {
    font-size: 11px; color: var(--muted);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  /* Figma-style floating toolbar */
  .toolbar {
    position: absolute; left: 50%; bottom: 20px;
    transform: translateX(-50%);
    z-index: 8;
    display: flex; align-items: center; gap: 2px;
    height: 48px; padding: 6px 8px;
    background: rgba(255,255,255,0.94);
    backdrop-filter: blur(18px);
    border: 1px solid rgba(0,0,0,0.06);
    border-radius: 14px;
    box-shadow:
      0 2px 4px rgba(20,24,40,0.04),
      0 12px 32px rgba(20,24,40,0.12);
  }
  .toolbar .divider {
    width: 1px; height: 22px; background: rgba(0,0,0,0.08); margin: 0 5px; flex-shrink: 0;
  }
  .tool-icon {
    width: 36px; height: 36px; border: none; background: transparent;
    border-radius: 10px; color: #444; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center;
    transition: background .15s, color .15s, transform .15s var(--spring);
  }
  .tool-icon:hover { background: rgba(0,0,0,0.05); color: #1A1A1A; }
  .tool-icon.active {
    color: #fff;
    background: #2C2C2C;
  }
  .tool-icon.active:hover { background: #1A1A1A; color: #fff; }
  .tool-icon svg {
    width: 18px; height: 18px; stroke: currentColor; fill: none;
    stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round;
  }

  .tool-group {
    position: relative;
    display: flex; align-items: stretch;
  }
  .tool-group .tool-main {
    width: 36px; height: 36px;
  }
  .tool-group .tool-more {
    width: 14px; height: 36px; margin-left: -2px;
    border: none; background: transparent; color: #888; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center;
    border-radius: 0 10px 10px 0;
    padding: 0;
  }
  .tool-group .tool-more:hover { background: rgba(0,0,0,0.05); color: #1A1A1A; }
  .tool-group.open .tool-more,
  .tool-group.active-group .tool-more { color: inherit; }
  .tool-group.active-group .tool-main {
    color: #fff; background: #2C2C2C;
    border-radius: 10px 0 0 10px;
  }
  .tool-group.active-group .tool-more {
    color: #fff; background: #2C2C2C;
  }
  .tool-group.active-group .tool-more:hover { background: #1A1A1A; }
  .tool-group .tool-more svg {
    width: 10px; height: 10px; stroke: currentColor; fill: none;
    stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
  }
  .tool-flyout {
    position: absolute; left: 50%; bottom: calc(100% + 10px);
    transform: translateX(-50%) translateY(4px);
    display: flex; flex-direction: column; gap: 2px;
    min-width: 148px; padding: 6px;
    background: rgba(255,255,255,0.96);
    backdrop-filter: blur(16px);
    border: 1px solid rgba(0,0,0,0.06);
    border-radius: 12px;
    box-shadow:
      0 2px 4px rgba(20,24,40,0.04),
      0 14px 36px rgba(20,24,40,0.14);
    opacity: 0; pointer-events: none;
    transition: opacity .16s var(--ease), transform .18s var(--ease);
    z-index: 9;
  }
  .tool-group.open .tool-flyout {
    opacity: 1; pointer-events: auto;
    transform: translateX(-50%) translateY(0);
  }
  .tool-flyout-item {
    border: none; background: transparent; cursor: pointer;
    display: flex; align-items: center; gap: 10px;
    width: 100%; padding: 8px 10px; border-radius: 8px;
    color: #333; font-family: inherit; font-size: 12.5px; font-weight: 550;
    text-align: left;
  }
  .tool-flyout-item:hover { background: rgba(0,0,0,0.05); }
  .tool-flyout-item.active {
    background: #F0F0F0; color: #111; font-weight: 650;
  }
  .tool-flyout-item svg {
    width: 16px; height: 16px; flex-shrink: 0;
    stroke: currentColor; fill: none;
    stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round;
  }

  .view-controls {
    position: absolute; top: 14px; right: 14px; z-index: 8;
  }
  .nav-panel {
    width: 188px;
    background: rgba(255,255,255,0.94);
    backdrop-filter: blur(18px);
    border: 1px solid rgba(0,0,0,0.06);
    border-radius: 14px;
    box-shadow:
      0 2px 4px rgba(20,24,40,0.04),
      0 12px 32px rgba(20,24,40,0.12);
    overflow: hidden;
    display: flex; flex-direction: column;
  }
  .nav-map {
    position: relative;
    height: 112px;
    background:
      radial-gradient(circle, rgba(0,0,0,0.06) 1px, transparent 1px) 0 0 / 10px 10px,
      #F7F8FA;
    cursor: crosshair;
  }
  .nav-map .dot {
    position: absolute; width: 9px; height: 9px; border-radius: 3px;
    background: #C8CCD4;
    transform: translate(-50%, -50%);
  }
  .nav-map .dot.selected {
    background: var(--brand);
    outline: 2px solid rgba(255,122,26,.35); outline-offset: 1px;
  }
  .nav-map .view {
    position: absolute; border: 1.5px solid rgba(255,122,26,.85);
    background: rgba(255,122,26,.1); border-radius: 3px;
    pointer-events: none;
  }
  .nav-bar {
    display: flex; align-items: center; gap: 2px;
    padding: 6px 8px;
    border-top: 1px solid rgba(0,0,0,0.06);
    background: rgba(255,255,255,0.72);
  }
  .nav-bar .nav-btn {
    width: 28px; height: 28px; border: none; background: transparent;
    border-radius: 8px; color: #555; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center;
    transition: background .15s, color .15s;
  }
  .nav-bar .nav-btn:hover { background: rgba(0,0,0,0.05); color: #1A1A1A; }
  .nav-bar .nav-btn svg {
    width: 15px; height: 15px; stroke: currentColor; fill: none;
    stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round;
  }
  .nav-bar .zoom-val {
    flex: 1; text-align: center;
    color: #555; font-size: 12px; font-weight: 650;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.01em;
    user-select: none;
  }

  /* ---------- Workspace ---------- */
  .workspace { flex: 1; display: flex; min-height: 0; position: relative; }

  .canvas-wrap {
    flex: 1; position: relative; overflow: hidden; cursor: default;
    background:
      radial-gradient(circle, rgba(0,0,0,0.07) 1px, transparent 1px) 0 0 / 22px 22px,
      linear-gradient(180deg, #F7F8FA 0%, #F1F2F5 100%);
  }
  .canvas-wrap.panning { cursor: grabbing; }
  .canvas-wrap.connecting { cursor: crosshair; }
  .canvas-world {
    position: absolute; left: 0; top: 0;
    transform-origin: 0 0;
    will-change: transform;
  }

  /* SVG connectors */
  .connectors { position: absolute; inset: 0; overflow: visible; pointer-events: none; }
  .connectors .hit { pointer-events: stroke; cursor: pointer; }
  .conn-path {
    fill: none;
    stroke: #B0B4BC;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-dasharray: 2.5 4;
    animation: flow .85s linear infinite;
    transition: stroke .2s, stroke-width .2s, filter .2s;
  }
  .conn-path.selected {
    stroke: var(--brand);
    stroke-width: 2.5;
    filter: drop-shadow(0 0 4px rgba(255,122,26,0.45));
    animation-duration: .65s;
  }
  .conn-path.temp {
    stroke: var(--brand);
    stroke-width: 2;
    stroke-dasharray: 2.5 4;
    animation: flow .65s linear infinite;
  }
  .conn-wrap:hover .conn-path {
    stroke: #8B919A;
    animation-duration: .65s;
  }
  .conn-wrap.selected .conn-path,
  .conn-wrap:hover.selected .conn-path {
    stroke: var(--brand);
  }
  @keyframes flow { to { stroke-dashoffset: -6.5; } }

  .conn-label {
    position: absolute; font-size: 11px; color: var(--muted);
    background: rgba(247,248,250,0.92); padding: 2px 7px; border-radius: 6px;
    white-space: nowrap; pointer-events: none;
    border: 1px solid rgba(0,0,0,0.04);
    transform: translate(-50%, -50%);
    opacity: 0; transition: opacity .2s;
  }
  .conn-label.show, .conn.selected + .conn-label, .conn-path.selected ~ .noop { opacity: 1; }
  .conn-wrap:hover .conn-label, .conn-wrap.selected .conn-label { opacity: 1; }

  /* ---------- Nodes ---------- */
  .node {
    position: absolute;
    width: 108px;
    text-align: center;
    cursor: grab;
    user-select: none;
    touch-action: none;
    z-index: 2;
    transition: filter .2s;
  }
  .node:active { cursor: grabbing; }
  .node .body {
    position: relative;
    width: 76px; height: 76px; margin: 0 auto 8px;
    border-radius: 20px;
    background: transparent;
    display: flex; align-items: center; justify-content: center;
    transition: transform .28s var(--spring);
  }
  .node:hover .body { transform: translateY(-2px); }
  .node:hover .icon-tile {
    box-shadow:
      0 1px 0 rgba(255,255,255,.9) inset,
      0 -1px 0 rgba(255,255,255,.2) inset,
      0 12px 28px -6px var(--tile-shadow, rgba(0,0,0,.18)),
      0 4px 10px rgba(20,24,40,.06);
    transform: translateY(-1px) scale(1.03);
  }
  .node.selected .body {
    transform: none;
  }
  .node.selected .icon-tile {
    transform: translateY(-2px) scale(1.06);
    border-color: color-mix(in srgb, var(--accent, var(--brand)) 55%, rgba(255,255,255,.5));
    box-shadow:
      0 0 0 2px var(--accent, var(--brand)),
      0 0 0 5px color-mix(in srgb, var(--accent, var(--brand)) 18%, transparent),
      0 1px 0 rgba(255,255,255,.9) inset,
      0 12px 28px -6px var(--tile-shadow, rgba(0,0,0,.16));
    animation: selectPop .42s var(--spring);
  }
  @keyframes selectPop {
    0% { transform: scale(0.94); }
    55% { transform: translateY(-2px) scale(1.09); }
    100% { transform: translateY(-2px) scale(1.06); }
  }
  .node .title {
    font-weight: 700; font-size: 12.5px; line-height: 1.25;
    white-space: nowrap; max-width: 108px;
    overflow: hidden; text-overflow: ellipsis;
  }
  .node .badge {
    display: inline-block; margin-left: 2px;
    color: #3FA34D; font-weight: 700; font-size: 11.5px;
  }

  .port {
    position: absolute; width: 14px; height: 14px; border-radius: 50%;
    background: #fff; border: 2px solid #B8BCC4;
    top: 50%; transform: translateY(-50%);
    cursor: crosshair; z-index: 3;
    transition: transform .2s var(--spring), border-color .2s, background .2s, box-shadow .2s;
    opacity: 0;
  }
  .node:hover .port, .node.selected .port, .canvas-wrap.connecting .port {
    opacity: 1;
  }
  .port.in { left: -8px; }
  .port.out { right: -8px; }
  .port:hover, .port.hot {
    transform: translateY(-50%) scale(1.25);
    border-color: var(--brand);
    background: var(--brand-soft);
    box-shadow: 0 0 0 4px rgba(255,122,26,0.18);
  }
  .node.selected .port { border-color: var(--accent, var(--brand)); }

  /* ---------- Info toast ---------- */
  .hint-bar {
    position: absolute; left: 50%; bottom: 80px; transform: translateX(-50%);
    background: rgba(30,32,38,0.82); color: #fff;
    padding: 8px 14px; border-radius: 999px; font-size: 12px;
    backdrop-filter: blur(10px); pointer-events: none;
    opacity: 0; transition: opacity .25s, transform .25s var(--ease);
    white-space: nowrap; z-index: 6;
  }
  .hint-bar.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ---------- Properties panel ---------- */
  .props {
    width: 300px; flex-shrink: 0;
    background: var(--panel);
    backdrop-filter: blur(20px);
    border-left: 1px solid var(--border);
    display: flex; flex-direction: column;
    transform: translateX(0);
    transition: width .3s var(--ease), opacity .25s, transform .3s var(--ease);
    overflow: hidden; z-index: 4;
  }
  .props.empty { width: 0; opacity: 0; border-left-width: 0; pointer-events: none; }
  .props-inner { width: 300px; display: flex; flex-direction: column; height: 100%; }
  .props-head {
    padding: 18px 18px 12px;
    display: flex; align-items: flex-start; gap: 12px;
    border-bottom: 1px solid var(--border);
  }
  .props-head .meta { flex: 1; min-width: 0; }
  .props-head .name {
    font-weight: 750; font-size: 15px; margin: 0 0 4px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .props-head .cat-pill {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 11.5px; font-weight: 600; color: var(--muted);
    background: #F4F4F5; padding: 3px 9px; border-radius: 999px;
  }
  .props-head .cat-pill i {
    width: 7px; height: 7px; border-radius: 50%; display: inline-block;
  }
  .props-close {
    border: none; background: #F3F3F3; width: 28px; height: 28px;
    border-radius: 8px; cursor: pointer; color: var(--muted);
    transition: background .2s, transform .2s var(--spring);
  }
  .props-close:hover { background: #E8E8E8; transform: scale(1.06); }

  .props-body { flex: 1; overflow-y: auto; padding: 14px 18px 24px; }
  .field { margin-bottom: 14px; }
  .field label {
    display: block; font-size: 11.5px; font-weight: 650;
    color: var(--muted); margin-bottom: 6px; letter-spacing: 0.02em;
  }
  .field input, .field select, .field textarea {
    width: 100%; padding: 9px 11px; border-radius: 10px;
    border: 1px solid var(--border); background: #fff;
    font-family: inherit; font-size: 13px; color: var(--text);
    transition: border-color .2s, box-shadow .2s;
  }
  .field input:focus, .field select:focus, .field textarea:focus {
    outline: none; border-color: rgba(255,122,26,0.45);
    box-shadow: 0 0 0 3px rgba(255,122,26,0.12);
  }

  /* ========== Transform ========== */
  function applyTransform(animate = false) {
    if (animate) world.style.transition = 'transform .35s var(--ease)';
    else world.style.transition = 'none';
    world.style.transform = `translate(${panX}px, ${panY}px) scale(${zoom})`;
    zoomVal.textContent = `${Math.round(zoom * 100)}%`;
    if (animate) setTimeout(() => { world.style.transition = 'none'; }, 360);
    drawMinimap();
  }

  function setZoom(next, cx, cy) {
    const rect = canvasWrap.getBoundingClientRect();
    const pivotX = cx ?? rect.width / 2;
    const pivotY = cy ?? rect.height / 2;
    const prev = zoom;
    zoom = Math.min(2.2, Math.max(0.35, next));
    panX = pivotX - (pivotX - panX) * (zoom / prev);
    panY = pivotY - (pivotY - panY) * (zoom / prev);
    applyTransform();
  }

  /* ========== Nodes ========== */
  function nodeById(id) { return nodes.find(n => n.id === id); }
  function metaOf(n) { return ITEM_MAP[n.type]; }

  function portCenter(node, which) {
    const bodyW = 84, bodyH = 84;
    const cx = node.x + 54; // node width 108, body centered
    const cy = node.y + bodyH / 2;
    return which === 'out'
      ? { x: node.x + (108 - 12) / 2 + 84 / 2 + 7, y: cy } // approx
      : { x: node.x + (108 - 84) / 2 - 7, y: cy };
  }

  // Precise port centers based on node layout (body 76px centered in 108)
  function getPort(node, side) {
    const left = node.x + (108 - 76) / 2;
    const cy = node.y + 38;
    return side === 'out'
      ? { x: left + 76, y: cy }
      : { x: left, y: cy };
  }

  function renderNodes() {
    nodesLayer.innerHTML = '';
    nodes.forEach(n => {
      const meta = metaOf(n);
      const el = document.createElement('div');
      el.className = 'node' + (selectedNodeId === n.id ? ' selected' : '');
      el.style.left = n.x + 'px';
      el.style.top = n.y + 'px';
      el.style.setProperty('--accent', meta.color);
      el.dataset.id = n.id;

      const body = document.createElement('div');
      body.className = 'body';
      body.appendChild(makeIco(meta.icon, 'node', meta.tile));

      const portIn = document.createElement('div');
      portIn.className = 'port in';
      portIn.dataset.side = 'in';
      portIn.dataset.node = n.id;

      const portOut = document.createElement('div');
      portOut.className = 'port out';
      portOut.dataset.side = 'out';
      portOut.dataset.node = n.id;

      body.appendChild(portIn);
      body.appendChild(portOut);

      const title = document.createElement('div');
      title.className = 'title';
      const ins = connections.filter(c => c.to === n.id).length;
      title.innerHTML = `${n.name}${ins ? ` <span class="badge">(${ins})</span>` : ''}`;

      el.appendChild(body);
      el.appendChild(title);
      nodesLayer.appendChild(el);

      const ico = body.querySelector('.icon-tile');

      // Select / drag at icon unit
      const onIconDown = e => {
        if (e.button !== 0) return;
        if (e.target.classList.contains('port')) return;
        if (spaceDown) return;
        e.stopPropagation();
        selectNode(n.id);
        startNodeDrag(n, e);
      };
      ico.addEventListener('mousedown', onIconDown);
      // Title still selects, but highlight stays on icon
      title.addEventListener('mousedown', e => {
        if (e.button !== 0 || spaceDown) return;
        e.stopPropagation();
        selectNode(n.id);
        startNodeDrag(n, e);
      });

      portOut.addEventListener('mousedown', e => {
        e.stopPropagation();
        e.preventDefault();
        beginLink(n.id, e);
      });

      portIn.addEventListener('mouseup', e => {
        e.stopPropagation();
        if (linking && linking.fromId !== n.id) finishLink(n.id);
      });
    });
    drawConnections();
    drawMinimap();
    renderProps();
  }

  let dragNode = null;
  function startNodeDrag(n, e) {
    dragNode = {
      id: n.id,
      ox: e.clientX,
      oy: e.clientY,
      sx: n.x,
      sy: n.y,
    };
  }

  function selectNode(id) {
    selectedNodeId = id;
    selectedConnId = null;
    renderNodes();
  }

  function selectConn(id) {
    selectedConnId = id;
    selectedNodeId = null;
    renderNodes();
  }

  function clearSelection() {
    selectedNodeId = null;
    selectedConnId = null;
    renderNodes();
  }

  /* ========== Connections ========== */
  function bezier(a, b) {
    const dx = Math.max(60, Math.abs(b.x - a.x) * 0.45);
    return `M ${a.x} ${a.y} C ${a.x + dx} ${a.y}, ${b.x - dx} ${b.y}, ${b.x} ${b.y}`;
  }

  function drawConnections() {
    connSvg.setAttribute('width', 4000);
    connSvg.setAttribute('height', 3000);
    connSvg.innerHTML = '';
    labelsLayer.innerHTML = '';

    connections.forEach(c => {
      const from = nodeById(c.from);
      const to = nodeById(c.to);
      if (!from || !to) return;
      const a = getPort(from, 'out');
      const b = getPort(to, 'in');
      const d = bezier(a, b);
      const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
      g.classList.add('conn-wrap');
      if (selectedConnId === c.id) g.classList.add('selected');

      const hit = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      hit.setAttribute('d', d);
      hit.setAttribute('stroke', 'transparent');
      hit.setAttribute('stroke-width', '14');
      hit.setAttribute('fill', 'none');
      hit.classList.add('hit');
      hit.style.pointerEvents = 'stroke';
      hit.addEventListener('mousedown', e => {
        e.stopPropagation();
        selectConn(c.id);
      });

      const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      path.setAttribute('d', d);
      path.classList.add('conn-path');
      if (selectedConnId === c.id) path.classList.add('selected');

      g.appendChild(hit);
      g.appendChild(path);
      connSvg.appendChild(g);

      if (c.label) {
        const mid = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 - 8 };
        const lbl = document.createElement('div');
        lbl.className = 'conn-label' + (selectedConnId === c.id ? ' show' : '');
        lbl.textContent = c.label;
        lbl.style.left = mid.x + 'px';
        lbl.style.top = mid.y + 'px';
        labelsLayer.appendChild(lbl);
      }
    });

    if (linking) {
      const from = nodeById(linking.fromId);
      if (from) {
        const a = getPort(from, 'out');
        const b = { x: linking.x, y: linking.y };
        const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        path.setAttribute('d', bezier(a, b));
        path.classList.add('conn-path', 'temp');
        connSvg.appendChild(path);
      }
    }
  }

  function screenToWorld(clientX, clientY) {
    const rect = canvasWrap.getBoundingClientRect();
    return {
      x: (clientX - rect.left - panX) / zoom,
      y: (clientY - rect.top - panY) / zoom,
    };
  }

  function beginLink(fromId, e) {
    const w = screenToWorld(e.clientX, e.clientY);
    linking = { fromId, x: w.x, y: w.y };
    canvasWrap.classList.add('connecting');
    showHint('입력 포트에 놓아 연결하세요 · Esc로 취소');
    drawConnections();
  }

  function finishLink(toId) {
    if (!linking) return;
    const exists = connections.some(c => c.from === linking.fromId && c.to === toId);
    if (!exists && linking.fromId !== toId) {
      connections.push({
        id: uid('c'),
        from: linking.fromId,
        to: toId,
        label: 'Data → Data',
      });
    }
    linking = null;
    canvasWrap.classList.remove('connecting');
    hideHint();
    renderNodes();
  }

  function cancelLink() {
    linking = null;
    canvasWrap.classList.remove('connecting');
    hideHint();
    drawConnections();
  }

          <div class="field"><label>라벨</label><input id="connLabel" value="${escapeAttr(c.label || '')}"></div>

  function escapeAttr(s) {
    return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
  }
  function escapeHtml(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
  }

  function deleteNode(id) {
    nodes = nodes.filter(n => n.id !== id);
    connections = connections.filter(c => c.from !== id && c.to !== id);
    selectedNodeId = null;
    renderNodes();
  }

  function deleteConn(id) {
    connections = connections.filter(c => c.id !== id);
    selectedConnId = null;
    renderNodes();
  }

  function duplicateNode(id) {
    const n = nodeById(id);
    if (!n) return;
    const copy = { ...n, id: uid('n'), x: n.x + 36, y: n.y + 36, name: n.name + ' 복사' };
    nodes.push(copy);
    selectNode(copy.id);
  }

  /* ========== Overview (DOM dots, like design-system build) ========== */
  let minimapMap = null;

  function drawMinimap() {
    minimap.querySelectorAll('.dot, .view').forEach(d => d.remove());
    const wrap = canvasWrap.getBoundingClientRect();
    const W = wrap.width || 1;
    const H = wrap.height || 1;

    // World bounds with padding (keeps overview useful with pan/zoom)
    let minX = 0, minY = 0, maxX = W / zoom, maxY = H / zoom;
    if (nodes.length) {
      minX = Infinity; minY = Infinity; maxX = -Infinity; maxY = -Infinity;
      nodes.forEach(n => {
        minX = Math.min(minX, n.x);
        minY = Math.min(minY, n.y);
        maxX = Math.max(maxX, n.x + 108);
        maxY = Math.max(maxY, n.y + 100);
      });
      const pad = 80;
      minX -= pad; minY -= pad; maxX += pad; maxY += pad;
    }
    const worldW = Math.max(400, maxX - minX);
    const worldH = Math.max(300, maxY - minY);
    const mw = minimap.clientWidth || 188;
    const mh = minimap.clientHeight || 112;
    const scale = Math.min(mw / worldW, mh / worldH);
    const ox = (mw - worldW * scale) / 2;
    const oy = (mh - worldH * scale) / 2;
    minimapMap = { minX, minY, scale, ox, oy };

    nodes.forEach(n => {
      const meta = metaOf(n);
      const dot = document.createElement('div');
      dot.className = 'dot' + (selectedNodeId === n.id ? ' selected' : '');
      dot.style.left = (ox + (n.x + 54 - minX) * scale) + 'px';
      dot.style.top = (oy + (n.y + 42 - minY) * scale) + 'px';
      if (meta) dot.style.background = meta.color;
      minimap.appendChild(dot);
    });

    const view = document.createElement('div');
    view.className = 'view';
    const vx = ox + (-panX / zoom - minX) * scale;
    const vy = oy + (-panY / zoom - minY) * scale;
    const vw = (W / zoom) * scale;
    const vh = (H / zoom) * scale;
    view.style.left = vx + 'px';
    view.style.top = vy + 'px';
    view.style.width = Math.max(8, vw) + 'px';
    view.style.height = Math.max(8, vh) + 'px';
    minimap.appendChild(view);
  }

  function minimapToPan(clientX, clientY) {
    if (!minimapMap) return;
    const rect = minimap.getBoundingClientRect();
    const mx = clientX - rect.left;
    const my = clientY - rect.top;
    const { minX, minY, scale, ox, oy } = minimapMap;
    const worldX = (mx - ox) / scale + minX;
    const worldY = (my - oy) / scale + minY;
    const wrap = canvasWrap.getBoundingClientRect();
    panX = wrap.width / 2 - worldX * zoom;
    panY = wrap.height / 2 - worldY * zoom;
    applyTransform();

    ellipse: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="7.5"/></svg>',
    draw: '<svg viewBox="0 0 24 24"><path d="M14.5 5.5 18.5 9.5"/><path d="M5 19.5 7.2 12.8 16.2 3.8a2 2 0 0 1 2.8 0l1.2 1.2a2 2 0 0 1 0 2.8L11.2 16.8 5 19.5Z"/></svg>',
    arrow: '<svg viewBox="0 0 24 24"><path d="M4 12h14"/><path d="M14 7.5 18.5 12 14 16.5"/></svg>',
    line: '<svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg>',
  };
  const TOOL_LABELS = {
    pan: '이동', select: '선택', rect: '사각형', diamond: '마름모',
    ellipse: '원', arrow: '화살표', line: '선', draw: '펜', text: '텍스트',
    eraser: '지우개', image: '이미지', connect: '연결',
  };
  const groupLastTool = { shape: 'rect', draw: 'draw' };

  function findToolGroup(tool) {
    return Object.keys(TOOL_GROUPS).find(g => TOOL_GROUPS[g].includes(tool)) || null;
  }

  function closeToolFlyouts(except = null) {
    document.querySelectorAll('#toolbar .tool-group.open').forEach(g => {
      if (g !== except) g.classList.remove('open');
    });
  }

  function syncToolUI() {
    const group = findToolGroup(activeTool);
    document.querySelectorAll('#toolbar > .tool-icon[data-tool]').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.tool === activeTool);
    });
    document.querySelectorAll('#toolbar .tool-group').forEach(wrap => {
      const g = wrap.dataset.group;
      const isActive = group === g;
      wrap.classList.toggle('active-group', isActive);
      const main = wrap.querySelector('.tool-main');
      const current = groupLastTool[g] || TOOL_GROUPS[g][0];
      if (main) {
        main.dataset.tool = current;
        main.innerHTML = TOOL_ICONS[current] || '';
        main.title = TOOL_LABELS[current] || g;
        main.classList.toggle('active', false);
      }
      wrap.querySelectorAll('.tool-flyout-item').forEach(item => {
        item.classList.toggle('active', item.dataset.tool === current && isActive);
      });
    });
  }

  function setActiveTool(tool, opts = {}) {
    activeTool = tool;
    const group = findToolGroup(tool);
    if (group) groupLastTool[group] = tool;
    syncToolUI();
    if (!opts.keepFlyout) closeToolFlyouts();
    canvasWrap.classList.toggle('panning', tool === 'pan');
    canvasWrap.style.cursor = tool === 'pan' ? 'grab' : '';
    if (TOOL_LABELS[tool]) showHint(TOOL_LABELS[tool]);
  }

  document.querySelectorAll('#toolbar > .tool-icon[data-tool]').forEach(btn => {
    btn.addEventListener('click', () => setActiveTool(btn.dataset.tool));
  });

  document.querySelectorAll('#toolbar .tool-group').forEach(wrap => {
    const main = wrap.querySelector('.tool-main');
    const more = wrap.querySelector('.tool-more');
    main?.addEventListener('click', () => {
      setActiveTool(main.dataset.tool);
    });
    more?.addEventListener('click', e => {
      e.stopPropagation();
      const willOpen = !wrap.classList.contains('open');
      closeToolFlyouts(wrap);
      wrap.classList.toggle('open', willOpen);
    });
    wrap.querySelectorAll('.tool-flyout-item').forEach(item => {
      item.addEventListener('click', e => {
        e.stopPropagation();
        setActiveTool(item.dataset.tool);
      });
    });
  });

  document.addEventListener('click', e => {
    if (!e.target.closest?.('#toolbar .tool-group')) closeToolFlyouts();
  });

  syncToolUI();

  document.getElementById('btnZoomIn').onclick = () => setZoom(zoom * 1.12);
  document.getElementById('btnZoomOut').onclick = () => setZoom(zoom / 1.12);
  document.getElementById('btnToggleSidebar').onclick = () => setSidebarOpen(false);
  document.getElementById('btnExpandSidebar').onclick = () => setSidebarOpen(true);
  document.getElementById('btnRailToggle').onclick = () => {
    rail.classList.toggle('collapsed');
    hideFlyout();
  };
  document.getElementById('btnRedo')?.addEventListener('click', () => showHint('다시 실행'));
  document.getElementById('btnUndo')?.addEventListener('click', () => showHint('실행 취소'));
  document.getElementById('btnFit').onclick = fitView;

  const tabsList = document.getElementById('tabsList');

const TAB_COLORS = ['tab-blue', 'tab-teal', 'tab-orange', 'tab-green', 'tab-purple'];

function tabCloseHtml() {
  return `<span class="tab-close" role="button" tabindex="0" title="닫기" aria-label="닫기">
    <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg>
  </span>`;
}

function activateTab(tab) {
  if (!tab || !tabsList) return;
  tabsList.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  tab.classList.add('active');
  showHint(tab.querySelector('.tab-label')?.textContent.trim() || '탭');
}

function closeTab(tab) {
  if (!tab || !tabsList) return;
  const wasActive = tab.classList.contains('active');
  const label = tab.querySelector('.tab-label')?.textContent.trim() || '탭';
  const next = tab.nextElementSibling?.classList.contains('tab')
    ? tab.nextElementSibling
    : tab.previousElementSibling;
  tab.remove();
  if (wasActive && next) activateTab(next);
  else if (wasActive) {
    const first = tabsList.querySelector('.tab');
    if (first) activateTab(first);
  }
  showHint(`${label} 닫힘`);
}

tabsList?.addEventListener('click', e => {
  const closeBtn = e.target.closest('.tab-close');
  if (closeBtn) {
    e.preventDefault();
    e.stopPropagation();
    closeTab(closeBtn.closest('.tab'));
    return;
  }
  const tab = e.target.closest('.tab');
  if (tab) activateTab(tab);
});

document.querySelector('.tab-add')?.addEventListener('click', () => {
  if (!tabsList) return;
  const n = tabsList.querySelectorAll('.tab').length + 1;
  const color = TAB_COLORS[(n - 1) % TAB_COLORS.length];
  const btn = document.createElement('button');
  btn.type = 'button';
  btn.className = `tab ${color}`;
  btn.innerHTML = `<span class="tab-shade" aria-hidden="true"></span><span class="tab-label">새 탭 ${n}</span>${tabCloseHtml()}`;
  tabsList.appendChild(btn);
  activateTab(btn);
});


  document.getElementById('btnRun').onclick = () => {
    showHint('워크플로 실행 중…');
    document.querySelectorAll('.conn-path').forEach(p => {
      p.style.stroke = 'var(--brand)';
      p.style.animationDuration = '0.55s';
    });
    setTimeout(() => {
      document.querySelectorAll('.conn-path').forEach(p => {
        p.style.stroke = '';
        p.style.animationDuration = '';
      });
      showHint('실행 완료');
    }, 900);
  };

  function fitView() {
    if (!nodes.length) return;
    let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    nodes.forEach(n => {
      minX = Math.min(minX, n.x);
      minY = Math.min(minY, n.y);
      maxX = Math.max(maxX, n.x + 108);
      maxY = Math.max(maxY, n.y + 110);
    });
    const pad = 80;
    const rect = canvasWrap.getBoundingClientRect();
    const w = maxX - minX + pad * 2;
    const h = maxY - minY + pad * 2;
    zoom = Math.min(1.4, Math.max(0.4, Math.min(rect.width / w, rect.height / h)));
    panX = (rect.width - (minX + maxX) * zoom) / 2;
    panY = (rect.height - (minY + maxY) * zoom) / 2;
    applyTransform(true);
  }

  // resize / periodic overview refresh
  window.addEventListener('resize', () => drawMinimap());
  setInterval(drawMinimap, 500);

  // init
  applyTransform();
  renderNodes();

  /* ========== Auth (local session) ========== */
  const AUTH_KEY = 'orange3-auth-user';
  const authOverlay = document.getElementById('authOverlay');
  const authForm = document.getElementById('authForm');
  const authError = document.getElementById('authError');
  const authUserEl = document.getElementById('authUser');
  const btnLogin = document.getElementById('btnLogin');
  const btnLogout = document.getElementById('btnLogout');

  function getUser() {
    try { return JSON.parse(localStorage.getItem(AUTH_KEY) || 'null'); }
    catch { return null; }
  }

  function setUser(user) {
    if (user) localStorage.setItem(AUTH_KEY, JSON.stringify(user));
    else localStorage.removeItem(AUTH_KEY);
  }

  function openAuth() {
    authError.textContent = '';
    authOverlay.hidden = false;
    document.getElementById('authEmailInput')?.focus();
  }

  function closeAuth() {
    authOverlay.hidden = true;
    authForm?.reset();
    authError.textContent = '';
  }

  function renderAuthUI() {
    const user = getUser();
    const loggedIn = !!user;
    authUserEl.hidden = !loggedIn;
    btnLogin.hidden = loggedIn;
    btnLogout.hidden = !loggedIn;
    if (loggedIn) {
      const name = user.name || user.email.split('@')[0];
      document.getElementById('authName').textContent = name;
      document.getElementById('authEmail').textContent = user.email;
      document.getElementById('authAvatar').textContent = (name[0] || 'U').toUpperCase();
      authUserEl.title = user.email;
    }
  }

  function renderAuth(opts = {}) {
    const user = getUser();
    renderAuthUI();
    if (user) closeAuth();
    else if (!opts.deferLogin) openAuth();
    else authOverlay.hidden = true;
  }

  authForm?.addEventListener('submit', e => {
    e.preventDefault();
    const email = document.getElementById('authEmailInput').value.trim();
    const password = document.getElementById('authPasswordInput').value;
    if (!email || !email.includes('@')) {
      authError.textContent = '올바른 이메일을 입력하세요';
      return;
    }
    if (password.length < 4) {
      authError.textContent = '비밀번호는 4자 이상이어야 합니다';
      return;
    }
    const name = email.split('@')[0];
    setUser({ email, name });
    renderAuth();
    showHint(`${name}님, 환영합니다`);
  });

  btnLogin?.addEventListener('click', openAuth);
  btnLogout?.addEventListener('click', () => {
    setUser(null);
    renderAuth();
    showHint('로그아웃되었습니다');
  });

  /* ========== Splash loading ========== */
  const splash = document.getElementById('splash');
  const splashBar = document.getElementById('splashBar');
  const splashPct = document.getElementById('splashPct');

  function finishSplash() {
    splash?.classList.add('is-done');
    splash?.setAttribute('aria-busy', 'false');
    renderAuth();
    if (getUser()) {
      showHint('위젯을 드래그하거나 · 포트에서 드래그해 연결 · ⌘/Ctrl+스크롤로 줌');
    }
  }

  function runSplash() {
    if (!splash || !splashBar) {
      finishSplash();
      return;
    }
    renderAuth({ deferLogin: true });
    let p = 0;
    const tick = () => {
      const step = p < 60 ? 2.2 + Math.random() * 2.5 : p < 90 ? 1.1 + Math.random() * 1.4 : 0.6;
      p = Math.min(100, p + step);
      splashBar.style.width = `${p}%`;
      splashPct.textContent = `${Math.round(p)}%`;
      if (p >= 100) {
        setTimeout(finishSplash, 280);
        return;
      }
      setTimeout(tick, 28 + Math.random() * 40);
    };
    setTimeout(tick, 180);
  }

  runSplash();
})();

</script>
