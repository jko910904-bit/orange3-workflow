name: Deploy EBS Admin to GitHub Pages

on:
  push:
    branches: [cursor/ebs-admin-dashboard-417c, gh-pages, main, master]
    paths:
      - "sites/ebs-admin/**"
      - ".github/workflows/deploy-ebs-admin-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-ebs-admin
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare static site
        run: |
          mkdir -p _site
          cp sites/ebs-admin/index.html sites/ebs-admin/styles.css sites/ebs-admin/app.js _site/
          # single-file fallback
          python3 - <<'PY'
          from pathlib import Path
          base = Path("sites/ebs-admin")
          html = (base / "index.html").read_text()
          css = (base / "styles.css").read_text()
          js = (base / "app.js").read_text()
          html = html.replace('<link rel="stylesheet" href="./styles.css" />', "<style>\n" + css + "\n</style>")
          html = html.replace('<script src="./app.js"></script>', "<script>\n" + js + "\n</script>")
          Path("_site/all.html").write_text(html)
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
